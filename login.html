<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kelola Koleksi</title>
    <link rel="stylesheet" href="aset/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            padding: 55px 40px;
            border: 1px solid #888;
            text-align: center;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .form-control {
            height: 48px;
            font-size: 16px;
        }

        .input-group-text {
            background-color: white;
            font-size: 18px;
        }

        .btn-login {
            height: 50px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <i class="bi bi-book-half"></i>
        </div>

        <!-- Judul -->
        <h3 class="fw-bold">Kelola Koleksi</h3>
        <p class="text-secondary fs-5">Komik&Novel</p>

        <!-- Form Login -->
        <form id="formLogin" class="mt-5">

            <!-- Username -->
            <div class="input-group mb-4">
                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>

                <input type="text"
                    id="username"
                    class="form-control"
                    placeholder="Masukkan Username"
                    required>
            </div>

            <!-- Password -->
            <div class="input-group mb-4">
                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password"
                    id="password"
                    class="form-control"
                    placeholder="Masukkan Password"
                    required>
            </div>

            <!-- Pesan -->
            <div id="pesanLogin" class="text-danger mb-3"></div>

            <!-- Tombol Login -->
            <button type="submit" class="btn btn-primary btn-login w-100">
                Login
            </button>

        </form>

    </div>
    
    <script src="aset/js/bootstrap.bundle.min.js"></script>
    <script src="aset/js/login.js"></script>

</body>
</html>
